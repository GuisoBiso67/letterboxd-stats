<p>home works!</p>
<input type="file" (change)="onFileSelected($event)" accept=".csv">
<br>
@if (stateService.movies().length > 0) {
  <button (click)="enrichMovies()" >Search movies information</button>
  
  @for (movie of stateService.movies(); track movie.title + movie.release_year) {
    <li>{{ movie.title }}</li>
  }
}
@if (stateService.stats_data()) {
  <app-genres [genres]="stateService.stats_data()!.genres"></app-genres>
}
