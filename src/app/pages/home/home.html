<p>home works!</p>
<input type="file" (change)="onFileSelected($event)" accept=".csv">
<br>
@if (movies().length > 0) {
  <button (click)="enrichMovies()" >Search movies information</button>
  
  @for (movie of movies(); track movie.title + movie.release_year) {
    <li>{{ movie.title }}</li>
  }
}
@if (stats_data()) {
  <app-genres [genres]="stats_data()!.genres"></app-genres>
}
